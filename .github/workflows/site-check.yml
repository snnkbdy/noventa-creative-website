name: Static site checks

on:
  push:
    paths:
      - "karaguslar-insaat/**"
      - "tests/validate_site.py"
      - ".github/workflows/site-check.yml"
  pull_request:
    paths:
      - "karaguslar-insaat/**"
      - "tests/validate_site.py"
      - ".github/workflows/site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate static site
        run: python tests/validate_site.py
