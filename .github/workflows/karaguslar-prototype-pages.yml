name: Publish Karaguslar prototype
on:
  push:
    branches: [main]
    paths:
      - 'karaguslar-insaat/prototype.html'
      - '.github/workflows/karaguslar-prototype-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: karaguslar-insaat
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
